<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分数统计展示</title>
  <style>
    :root {
      --primary: #3498db;
      --green: #2ecc71;
      --purple: #9b59b6;
      --text-dark: #2c3e50;
      --text-muted: #5b6b7c;
      --bg: #f5f7fa;
      --card-bg: #ffffff;
      --chip-bg: #e3f2fd;
      --chip-text: #1565c0;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text-dark);
      line-height: 1.6;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: clamp(24px, 4vw, 28px);
      color: var(--text-dark);
      letter-spacing: 0.5px;
    }

    .data-section {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .data-section h2 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #34495e;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .data-section h2::before {
      content: '';
      width: 4px;
      height: 18px;
      background: var(--primary);
      border-radius: 2px;
      flex-shrink: 0;
    }

    .scores-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      list-style: none;
    }

    .scores-list li {
      background: var(--chip-bg);
      color: var(--chip-text);
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 15px;
      box-shadow: 0 2px 6px rgba(21, 101, 192, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .scores-list li:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(21, 101, 192, 0.16);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .stat-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      border-top: 4px solid var(--primary);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .stat-card:nth-child(2) {
      border-top-color: var(--green);
    }

    .stat-card:nth-child(3) {
      border-top-color: var(--purple);
    }

    .stat-label {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .stat-value {
      font-size: clamp(28px, 5vw, 36px);
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.2;
    }

    .rate-good {
      color: #27ae60;
    }

    .rate-bad {
      color: #e74c3c;
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 16px;
      }

      h1 {
        margin-bottom: 24px;
      }

      .data-section,
      .stat-card {
        padding: 20px;
      }

      .scores-list {
        gap: 8px;
      }

      .scores-list li {
        padding: 7px 13px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>演示分数统计</h1>

    <section class="data-section">
      <h2>演示数据</h2>
      <ul class="scores-list" id="scoresList"></ul>
    </section>

    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">平均分</div>
        <div class="stat-value" id="average"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">中位数</div>
        <div class="stat-value" id="median"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">及格率</div>
        <div class="stat-value" id="passRate"></div>
      </div>
    </section>
  </div>

  <script>
    const scores = [85, 92, 78, 60, 45, 88, 72, 95, 30, 68];

    const scoresList = document.getElementById('scoresList');
    scores.forEach(score => {
      const li = document.createElement('li');
      li.textContent = score + ' 分';
      scoresList.appendChild(li);
    });

    const average = scores.reduce((sum, s) => sum + s, 0) / scores.length;

    const sorted = scores.slice().sort((a, b) => a - b);
    const mid = Math.floor(sorted.length / 2);
    const median = sorted.length % 2 === 0
      ? (sorted[mid - 1] + sorted[mid]) / 2
      : sorted[mid];

    const passCount = scores.filter(s => s >= 60).length;
    const passRate = (passCount / scores.length) * 100;

    document.getElementById('average').textContent = average.toFixed(1);
    document.getElementById('median').textContent = median.toFixed(1);

    const passRateEl = document.getElementById('passRate');
    passRateEl.textContent = passRate.toFixed(0) + '%';
    passRateEl.classList.add(passRate >= 60 ? 'rate-good' : 'rate-bad');
  </script>
</body>
</html>
